<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REX CLOUD | Enterprise Encryption Terminal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --accent-primary: #ff416c;
            --accent-secondary: #ff4b2b;
            --bg-deep: #020205;
            --glass-white: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --storage-gradient: linear-gradient(90deg, #ff416c, #ffb347, #00d2ff);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 65, 108, 0.05) 0%, transparent 40%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }

        .glass-card {
            background: var(--glass-white);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
        }

        /* 1TB Rainbow Bar */
        .storage-bar-bg { height: 10px; background: rgba(0,0,0,0.4); border-radius: 10px; overflow: hidden; }
        #storage-bar-fill {
            height: 100%; width: 0%;
            background: var(--storage-gradient);
            background-size: 200% 200%;
            animation: gradientMove 3s linear infinite;
            transition: width 1.5s ease;
        }
        @keyframes gradientMove { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        /* Preview Overlay */
        #media-viewer {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }

        .rex-input {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 15px; color: white; width: 100%;
        }

        .upload-queue-item {
            background: rgba(255,255,255,0.05); border-radius: 15px; padding: 10px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }

        #dust-canvas-container { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; }
    </style>
</head>
<body>

    <div id="dust-canvas-container"></div>

    <div id="media-viewer">
        <button onclick="closeViewer()" class="absolute top-10 right-10 text-4xl">&times;</button>
        <div id="viewer-content" class="max-w-[90%] max-h-[80%] flex items-center justify-center"></div>
        <p id="viewer-name" class="mt-5 orbitron text-xs text-gray-400"></p>
    </div>

    <section id="screen-auth" class="min-h-screen flex items-center justify-center p-6">
        <div class="glass-card p-10 w-full max-w-md text-center">
            <h1 class="orbitron text-4xl font-black mb-10 italic text-red-500">REX CLOUD</h1>
            <div id="login-container" class="space-y-4">
                <input type="email" id="input-email" placeholder="ADMIN EMAIL" class="rex-input">
                <input type="password" id="input-pass" placeholder="MASTER PASS" class="rex-input">
                <button onclick="handleInitialAuth()" class="w-full bg-red-600 py-4 rounded-xl font-bold">START TERMINAL</button>
            </div>
        </div>
    </section>

    <section id="screen-lock" class="min-h-screen flex flex-col items-center justify-center p-6 hidden">
        <div class="glass-card p-10 w-full max-w-sm text-center">
            <i class="fas fa-fingerprint text-6xl text-red-500 mb-8 animate-pulse" onclick="alert('Biometric Scanning...')"></i>
            <h2 class="orbitron text-xs mb-8 tracking-widest">VERIFY IDENTITY</h2>
            <div id="pin-dots" class="flex justify-center gap-4 mb-8">
                <div class="h-3 w-3 rounded-full border border-red-500"></div>
                <div class="h-3 w-3 rounded-full border border-red-500"></div>
                <div class="h-3 w-3 rounded-full border border-red-500"></div>
                <div class="h-3 w-3 rounded-full border border-red-500"></div>
            </div>
            <div class="grid grid-cols-3 gap-4" id="pin-pad"></div>
        </div>
    </section>

    <section id="screen-dashboard" class="min-h-screen p-6 hidden max-w-2xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="orbitron text-xl font-bold">REX CLOUD</h1>
                <p id="user-tag" class="text-[10px] text-gray-500 font-bold uppercase"></p>
            </div>
            <button onclick="toggleSettings()" class="h-12 w-12 glass-card flex items-center justify-center">
                <i class="fas fa-cog"></i>
            </button>
        </header>

        <div class="grid grid-cols-12 gap-4 mb-8">
            <div onclick="contactPro()" class="col-span-4 glass-card p-4 flex flex-col items-center justify-center border-yellow-500/20 cursor-pointer">
                <i class="fas fa-crown text-yellow-500 mb-2"></i>
                <span class="text-[8px] font-black uppercase text-center">Update Pro</span>
            </div>
            <div class="col-span-8 glass-card p-5">
                <div class="flex justify-between text-[10px] font-bold mb-2">
                    <span id="stat-gb">0.00 GB</span>
                    <span class="text-red-500" id="stat-limit">LIMIT: 1,024 GB</span>
                </div>
                <div class="storage-bar-bg"><div id="storage-bar-fill"></div></div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <label class="glass-card p-6 flex flex-col items-center justify-center cursor-pointer border-dashed border-white/10">
                <i class="fas fa-file-upload text-red-500 text-2xl mb-2"></i>
                <span class="text-[10px] font-bold uppercase">Multi Upload</span>
                <input type="file" multiple id="file-input" class="hidden" onchange="handleFiles(this)">
            </label>
            <div onclick="remoteUpload()" class="glass-card p-6 flex flex-col items-center justify-center cursor-pointer">
                <i class="fas fa-link text-blue-500 text-2xl mb-2"></i>
                <span class="text-[10px] font-bold uppercase">Remote Link</span>
            </div>
        </div>

        <div id="upload-queue" class="mb-8"></div>

        <div class="flex gap-2 overflow-x-auto pb-6 no-scrollbar mb-4">
            <button onclick="renderFiles('all')" class="glass-card px-6 py-2 text-[10px] font-bold uppercase">All</button>
            <button onclick="renderFiles('image')" class="glass-card px-6 py-2 text-[10px] font-bold uppercase">Photos</button>
            <button onclick="renderFiles('video')" class="glass-card px-6 py-2 text-[10px] font-bold uppercase">Videos</button>
            <button onclick="renderFiles('doc')" class="glass-card px-6 py-2 text-[10px] font-bold uppercase">Docs</button>
        </div>

        <div id="file-container" class="space-y-4 pb-20"></div>
    </section>

    <div id="panel-settings" class="fixed inset-0 bg-black/95 z-[5000] p-10 hidden">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center mb-10">
                <h2 class="orbitron text-xl">SETTINGS</h2>
                <button onclick="toggleSettings()" class="text-3xl">&times;</button>
            </div>
            <div class="space-y-6">
                <div class="glass-card p-6">
                    <p class="text-[10px] text-gray-500 mb-4 uppercase">Security Protocol</p>
                    <input type="password" id="new-pin" placeholder="NEW 4-DIGIT PIN" class="rex-input mb-4" maxlength="4">
                    <button onclick="updatePin()" class="w-full bg-white text-black py-3 rounded-xl font-bold text-xs">UPDATE PIN</button>
                </div>
                <button onclick="logout()" class="w-full py-4 text-red-500 font-bold glass-card">LOGOUT SESSION</button>
            </div>
        </div>
    </div>

    <script>
        const REX_CONFIG = {
            BOT_TOKEN: '8664449438:AAFEvs3o65mnfIuaZSC06kfcZ_09VoAFg90',
            CHAT_ID: '8097272918',
            ADMIN_WA: '94767531213'
        };

        let DB = JSON.parse(localStorage.getItem('REX_VAULT')) || [];
        let SETTINGS = JSON.parse(localStorage.getItem('REX_SETTINGS')) || { pin: '1234', limitGB: 1024, isAuth: false };
        let pinInput = "";

        // 1. AUTH LOGIC
        window.onload = () => {
            if(SETTINGS.isAuth) {
                document.getElementById('screen-auth').classList.add('hidden');
                document.getElementById('screen-lock').classList.remove('hidden');
                renderPinPad();
            }
        };

        function handleInitialAuth() {
            const email = document.getElementById('input-email').value;
            if(email.includes('@')) {
                SETTINGS.isAuth = true;
                localStorage.setItem('REX_SETTINGS', JSON.stringify(SETTINGS));
                location.reload();
            }
        }

        function renderPinPad() {
            const pad = document.getElementById('pin-pad');
            for(let i=1; i<=9; i++) {
                const b = document.createElement('button');
                b.className = "glass-card py-5 font-bold orbitron";
                b.innerText = i;
                b.onclick = () => handlePin(i);
                pad.appendChild(b);
            }
            // 0 button
            const z = document.createElement('button');
            z.className = "col-start-2 glass-card py-5 font-bold orbitron";
            z.innerText = "0";
            z.onclick = () => handlePin(0);
            pad.appendChild(z);
        }

        function handlePin(num) {
            if(pinInput.length < 4) {
                pinInput += num;
                updatePinDots();
                if(pinInput.length === 4) {
                    if(pinInput === SETTINGS.pin) {
                        document.getElementById('screen-lock').classList.add('hidden');
                        document.getElementById('screen-dashboard').classList.remove('hidden');
                        refreshUI();
                    } else {
                        alert("DENIED");
                        pinInput = "";
                        updatePinDots();
                    }
                }
            }
        }

        function updatePinDots() {
            const dots = document.querySelectorAll('#pin-dots div');
            dots.forEach((d, i) => d.style.background = i < pinInput.length ? '#ff416c' : 'transparent');
        }

        // 2. FILE HANDLING
        async function handleFiles(input) {
            const files = Array.from(input.files);
            const queue = document.getElementById('upload-queue');
            
            for(const file of files) {
                const id = 'up-' + Date.now();
                const item = document.createElement('div');
                item.id = id;
                item.className = "upload-queue-item animate-pulse";
                item.innerHTML = `
                    <span class="text-[10px] truncate max-w-[150px]">${file.name}</span>
                    <button onclick="this.parentElement.remove()" class="text-red-500 text-xs">CANCEL</button>
                `;
                queue.appendChild(item);

                // Upload
                const formData = new FormData();
                formData.append('chat_id', REX_CONFIG.CHAT_ID);
                formData.append('document', file);
                
                try {
                    const res = await fetch(`https://api.telegram.org/bot${REX_CONFIG.BOT_TOKEN}/sendDocument`, {
                        method: 'POST', body: formData
                    });
                    const data = await res.json();
                    
                    if(data.ok) {
                        const fileObj = {
                            id: Date.now() + Math.random(),
                            name: file.name,
                            size: file.size,
                            type: file.type,
                            fileId: data.result.document.file_id,
                            cat: file.type.includes('image') ? 'image' : (file.type.includes('video') ? 'video' : 'doc')
                        };
                        DB.unshift(fileObj);
                        saveDB();
                        item.remove();
                        refreshUI();
                    }
                } catch(e) { alert("FAIL: " + file.name); }
            }
        }

        // 3. MEDIA PREVIEW (Telegram බොට් එකෙන් ෆයිල් එක ඇප් එකට ගෙන ඒම)
        async function viewFile(fileId, type, name) {
            const viewer = document.getElementById('media-viewer');
            const content = document.getElementById('viewer-content');
            content.innerHTML = `<div class="animate-spin text-4xl"><i class="fas fa-circle-notch"></i></div>`;
            viewer.style.display = 'flex';
            
            // Get File Path
            const pathRes = await fetch(`https://api.telegram.org/bot${REX_CONFIG.BOT_TOKEN}/getFile?file_id=${fileId}`);
            const pathData = await pathRes.json();
            const url = `https://api.telegram.org/file/bot${REX_CONFIG.BOT_TOKEN}/${pathData.result.file_path}`;

            if(type.includes('image')) {
                content.innerHTML = `<img src="${url}" class="max-w-full rounded-lg">`;
            } else if(type.includes('video')) {
                content.innerHTML = `<video src="${url}" controls autoplay class="max-w-full rounded-lg"></video>`;
            } else {
                content.innerHTML = `<i class="fas fa-file-alt text-6xl mb-4"></i><a href="${url}" target="_blank" class="bg-white text-black px-8 py-3 rounded-full font-bold">DOWNLOAD DOC</a>`;
            }
            document.getElementById('viewer-name').innerText = name;
        }

        function closeViewer() { document.getElementById('media-viewer').style.display = 'none'; }

        // 4. REMOTE UPLOAD (Drive/Mediafire links simulation)
        function remoteUpload() {
            const url = prompt("ENTER DIRECT LINK (Drive, Mediafire, etc):");
            if(url) {
                alert("REMOTE MIRRORING INITIALIZED. THE SERVER IS DOWNLOADING AND ENCRYPTING THE OBJECT.");
            }
        }

        // 5. UI REFRESH & STATS
        function refreshUI() {
            renderFiles('all');
            const total = DB.reduce((s, f) => s + f.size, 0);
            const gbUsed = (total / (1024**3)).toFixed(2);
            document.getElementById('stat-gb').innerText = gbUsed + " GB";
            document.getElementById('stat-limit').innerText = `LIMIT: ${SETTINGS.limitGB} GB`;
            document.getElementById('storage-bar-fill').style.width = (gbUsed / SETTINGS.limitGB * 100) + "%";
        }

        function renderFiles(cat) {
            const cont = document.getElementById('file-container');
            cont.innerHTML = "";
            const filtered = cat === 'all' ? DB : DB.filter(f => f.cat === cat);
            
            filtered.forEach(f => {
                const div = document.createElement('div');
                div.id = 'f-' + f.id;
                div.className = "glass-card p-5 flex justify-between items-center";
                div.innerHTML = `
                    <div class="flex items-center gap-4 flex-1" onclick="viewFile('${f.fileId}', '${f.type}', '${f.name}')">
                        <i class="fas ${f.cat === 'image' ? 'fa-image text-pink-500' : (f.cat === 'video' ? 'fa-play-circle text-blue-500' : 'fa-file text-gray-500')} text-xl"></i>
                        <div class="overflow-hidden">
                            <p class="text-[11px] font-bold truncate max-w-[150px]">${f.name}</p>
                            <p class="text-[8px] text-gray-600 font-bold uppercase">${(f.size/1024/1024).toFixed(2)} MB</p>
                        </div>
                    </div>
                    <button onclick="thanosSnap('f-${f.id}', ${f.id})" class="text-gray-700 hover:text-red-500"><i class="fas fa-trash"></i></button>
                `;
                cont.appendChild(div);
            });
        }

        // 6. THANOS DELETE
        async function thanosSnap(divId, dbId) {
            const el = document.getElementById(divId);
            const canvas = await html2canvas(el, { backgroundColor: null });
            el.style.display = 'none';
            // (Thanos animation logic simplified for space)
            DB = DB.filter(f => f.id !== dbId);
            saveDB();
            refreshUI();
        }

        // 7. SETTINGS & ADMIN
        function toggleSettings() {
            const s = document.getElementById('panel-settings');
            s.classList.toggle('hidden');
        }

        function updatePin() {
            const p = document.getElementById('new-pin').value;
            if(p.length === 4) { SETTINGS.pin = p; saveSettings(); alert("PIN UPDATED"); toggleSettings(); }
        }

        function logout() { localStorage.clear(); location.reload(); }

        function contactPro() { window.open(`https://wa.me/${REX_CONFIG.ADMIN_WA}?text=Pro`, '_blank'); }

        // ADMIN FUNCTION: GB ප්‍රමාණය වෙනස් කිරීමට
        window.ADMIN_SET_GB = (val) => {
            SETTINGS.limitGB = val;
            saveSettings();
            refreshUI();
            console.log("GB LIMIT UPDATED TO: " + val);
        };

        function saveDB() { localStorage.setItem('REX_VAULT', JSON.stringify(DB)); }
        function saveSettings() { localStorage.setItem('REX_SETTINGS', JSON.stringify(SETTINGS)); }
    </script>
</body>
</html>
