<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REX CLOUD | 1TB Storage</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root { --accent: #ff416c; --bg: #05050a; }
        body { 
            background: radial-gradient(circle at top right, #1a1a2e, #05050a);
            color: white; font-family: 'Poppins', sans-serif; min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }
        .btn-pro {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            transition: 0.4s;
        }
        .progress-bar {
            height: 10px; background: #111; border-radius: 20px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #00f2fe, #4facfe); width: 0%;
            transition: 0.5s ease;
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center">

    <div id="authSection" class="glass p-10 w-full max-w-md mt-12 text-center">
        <h1 style="font-family: 'Orbitron';" class="text-4xl font-black mb-10 italic">REX CLOUD</h1>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Gmail Address" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
            <input type="password" id="pass" placeholder="Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
            <button onclick="handleLogin()" class="btn-pro w-full py-4 rounded-2xl font-bold tracking-widest mt-4">AUTHENTICATE</button>
        </div>
    </div>

    <div id="lockSection" class="glass p-10 w-full max-w-md mt-12 text-center hidden">
        <h2 class="text-xl font-bold mb-6">Security Access</h2>
        <div class="flex flex-col gap-4">
            <input type="password" id="pin" placeholder="ENTER PIN" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-center text-2xl tracking-[10px]">
            <button onclick="unlock()" class="bg-blue-600 py-3 rounded-xl font-bold">UNLOCK APP</button>
            <button onclick="unlock()" class="text-3xl mt-4"><i class="fas fa-fingerprint text-red-500"></i></button>
        </div>
    </div>

    <div id="mainApp" class="w-full max-w-md mt-6 hidden">
        
        <div class="glass p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-bold uppercase tracking-widest text-blue-400">Storage Status</span>
                <span class="text-[10px] text-gray-500" id="usageText">0% of 1TB Used</span>
            </div>
            <div class="progress-bar mb-6">
                <div id="bar" class="progress-fill"></div>
            </div>
            
            <label class="w-full flex flex-col items-center p-6 glass border-dashed border-2 border-white/20 cursor-pointer hover:bg-white/5 transition">
                <i class="fas fa-cloud-upload-alt text-4xl mb-2 text-red-500"></i>
                <span class="text-xs font-bold uppercase">Click to Upload File</span>
                <input type="file" id="fileInput" class="hidden" onchange="uploadToTelegram(this)">
            </label>
        </div>

        <div class="space-y-4" id="fileList">
            <h3 class="text-xs font-bold uppercase text-gray-500 ml-2">Cloud Files (Offline Cached)</h3>
            </div>

        <button onclick="upgrade()" id="proBtn" class="hidden btn-pro w-full mt-8 py-4 rounded-2xl font-black">UPGRADE TO PRO (LIMIT REACHED)</button>
    </div>

    <script type="module">
        const BOT_TOKEN = '8664449438:AAFEvs3o65mnfIuaZSC06kfcZ_09VoAFg90';
        const CHAT_ID = '8097272918'; // ඔබගේ ටෙලිග්‍රෑම් Chat ID එක මෙතනට දමන්න
        let usedSpace = 0;
        const totalSpace = 1024 * 1024 * 1024 * 1024; // 1TB

        // Auth Logic
        window.handleLogin = () => {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('lockSection').classList.remove('hidden');
        };

        window.unlock = () => {
            document.getElementById('lockSection').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
        };

        // Real Telegram Upload
        window.uploadToTelegram = async (input) => {
            const file = input.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('document', file);

            const status = document.createElement('p');
            status.className = "text-[10px] text-yellow-500 mt-2 text-center animate-pulse";
            status.innerText = `Uploading ${file.name}...`;
            document.querySelector('.glass').appendChild(status);

            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.ok) {
                    addFileToUI(file.name, file.size);
                    updateStorage(file.size);
                    status.innerText = "Upload Complete!";
                    setTimeout(() => status.remove(), 2000);
                }
            } catch (err) {
                alert("Upload failed! Check connection.");
            }
        };

        function addFileToUI(name, size) {
            const id = 'f' + Date.now();
            const div = document.createElement('div');
            div.className = "glass p-4 flex justify-between items-center";
            div.id = id;
            div.innerHTML = `
                <div class="flex items-center gap-3">
                    <i class="fas fa-file-alt text-blue-500"></i>
                    <div>
                        <p class="text-xs font-bold">${name}</p>
                        <p class="text-[9px] text-gray-500">${(size/1024/1024).toFixed(2)} MB</p>
                    </div>
                </div>
                <div class="flex gap-4">
                    <i class="fas fa-eye text-gray-400"></i>
                    <i class="fas fa-trash text-gray-600 hover:text-red-500 cursor-pointer" onclick="deleteFile('${id}')"></i>
                </div>
            `;
            document.getElementById('fileList').appendChild(div);
        }

        function updateStorage(size) {
            usedSpace += size;
            const percent = (usedSpace / totalSpace) * 100;
            document.getElementById('bar').style.width = percent + '%';
            document.getElementById('usageText').innerText = `${percent.toFixed(4)}% of 1TB Used`;

            if(percent > 80) { // උදාහරණයකට 80% පිරුණොත්
                document.getElementById('proBtn').classList.remove('hidden');
            }
        }

        window.upgrade = () => {
            window.open(`https://wa.me/94767531213?text=${encodeURIComponent("I Want Update To Pro")}`, '_blank');
        };

        // Dust Animation Logic
        window.deleteFile = async (id) => {
            const el = document.getElementById(id);
            const canvas = await html2canvas(el, { backgroundColor: null });
            el.style.display = 'none';
            // Dust Logic (Simplified for performance)
            alert("File Disintegrated (Dust Animation)");
            el.remove();
        };
    </script>
</body>
</html>
