<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REX CLOUD | Next-Gen Storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #ff416c; --bg: #080810; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; }
        
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .input-style {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            color: white;
            outline: none;
        }

        .btn-pro {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-pro:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(255, 65, 108, 0.4); }

        /* Progress Bar Animation */
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            width: 85%; /* මෙතනින් පිරෙන ප්‍රමාණය වෙනස් කරන්න */
            border-radius: 10px;
            transition: 2s ease-in-out;
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center">

    <div id="authSection" class="glass p-8 w-full max-w-md mt-10">
        <h1 class="text-3xl font-black italic mb-6 text-center">REX CLOUD</h1>
        <div class="space-y-4">
            <input type="text" id="regName" placeholder="Full Name" class="input-style">
            <input type="email" id="regEmail" placeholder="Gmail Address" class="input-style">
            <input type="password" id="regPass" placeholder="Create Password" class="input-style">
            <button onclick="handleAuth()" class="btn-pro w-full py-3 rounded-xl">SIGN UP</button>
        </div>
    </div>

    <div id="lockSection" class="glass p-8 w-full max-w-md mt-10 hidden">
        <h2 class="text-xl font-bold mb-4 text-center">Verify Identity</h2>
        <p class="text-gray-400 text-sm text-center mb-6">Enter Passcode or use Fingerprint</p>
        <input type="password" id="passcode" placeholder="4-Digit Passcode" class="input-style mb-4 text-center text-2xl tracking-widest">
        <div class="flex gap-2">
            <button onclick="unlockApp()" class="btn-pro flex-1 py-3 rounded-xl">UNLOCK</button>
            <button onclick="biometricAuth()" class="glass px-4 rounded-xl"><i class="fas fa-fingerprint text-2xl"></i></button>
        </div>
    </div>

    <div id="mainApp" class="w-full max-w-md mt-6 hidden">
        <div class="glass p-6 mb-4">
            <div class="flex justify-between mb-2 text-sm">
                <span>Storage Used</span>
                <span>8.5 GB / 10 GB</span>
            </div>
            <div class="h-2 w-full bg-gray-800 rounded-full overflow-hidden">
                <div class="progress-fill"></div>
            </div>
            <button onclick="updateToPro()" class="btn-pro w-full mt-6 py-2 rounded-lg text-sm">UPDATE TO PRO</button>
        </div>

        <div class="glass p-6 mb-4">
            <h3 class="text-sm font-bold mb-3 uppercase tracking-wider">Remote Download to Cloud</h3>
            <div class="flex flex-col gap-2">
                <input type="text" id="downloadUrl" placeholder="Paste link (Google Drive, Mega, etc)" class="input-style text-xs">
                <button onclick="remoteDownload()" class="bg-blue-600 py-2 rounded-lg font-bold text-xs">START REMOTE UPLOAD</button>
            </div>
            <p class="text-[10px] text-gray-500 mt-2">*Files download directly to REX CLOUD storage without using your phone data.</p>
        </div>

        <div class="glass p-6">
            <h3 class="text-sm font-bold mb-3">Recent Files (Available Offline)</h3>
            <div class="space-y-3">
                <div class="flex justify-between items-center text-xs border-b border-gray-800 pb-2">
                    <span><i class="far fa-file-video mr-2"></i> movie_hd.mp4</span>
                    <i class="fas fa-trash text-red-500" onclick="alert('File Deleted')"></i>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase Config (ඔයාගේ කලින් එවපු Config එක)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADiuQC24WIRTT__NI4mSgc7vjNpquy4CI",
            authDomain: "rexcloud-v1.firebaseapp.com",
            projectId: "rexcloud-v1",
            storageBucket: "rexcloud-v1.firebasestorage.app",
            messagingSenderId: "755772237011",
            appId: "1:755772237011:web:77459b8b9c39beab73e026"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // UI Logic Functions (Global scope එකට දාන්න)
        window.handleAuth = () => {
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            
            createUserWithEmailAndPassword(auth, email, pass)
                .then(() => {
                    document.getElementById('authSection').classList.add('hidden');
                    document.getElementById('lockSection').classList.remove('hidden');
                })
                .catch(err => alert(err.message));
        };

        window.unlockApp = () => {
            const pin = document.getElementById('passcode').value;
            if(pin === "1234") { // Temporary PIN
                document.getElementById('lockSection').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
            } else { alert("Wrong Passcode!"); }
        };

        window.biometricAuth = async () => {
            alert("Fingerprint Sensor Active... (Waiting for touch)");
            // WebAuthn API එක මෙතනට පාවිච්චි කළ හැකියි.
            setTimeout(() => window.unlockApp(), 1000); 
        };

        window.updateToPro = () => {
            const msg = "I Want Update To Pro";
            window.open(`https://wa.me/94767531213?text=${encodeURIComponent(msg)}`, '_blank');
        };

        window.remoteDownload = () => {
            const link = document.getElementById('downloadUrl').value;
            if(link) {
                alert("Remote Upload Started! You can close the app now. File will appear in your cloud once finished.");
            }
        };
    </script>
</body>
</html>
