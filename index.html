<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REX CLOUD | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Dark Moody Aesthetic */
        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #080810 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 420px;
            text-align: center;
        }

        .login-btn {
            background: #ffffff;
            color: #000;
            transition: all 0.3s ease;
            border: none;
        }

        .login-btn:hover {
            background: #e2e2e2;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }

        #status {
            min-height: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1 class="text-4xl font-black mb-2 tracking-tighter italic">REX CLOUD</h1>
        <p class="text-gray-500 mb-10 text-sm uppercase tracking-widest">Mobile Cloud Storage</p>
        
        <button id="googleLogin" class="login-btn w-full py-4 rounded-xl font-bold flex items-center justify-center gap-3 shadow-lg">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/layout/google.svg" width="22" alt="G">
            Continue with Google
        </button>

        <p id="status" class="mt-6 text-gray-400"></p>
    </div>

    <script type="module">
        // Firebase SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, GoogleAuthProvider, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ඔයාගේ Config එක මෙතැනට ඇඩ් කළා
        const firebaseConfig = {
            apiKey: "AIzaSyADiuQC24WIRTT__NI4mSgc7vjNpquy4CI",
            authDomain: "rexcloud-v1.firebaseapp.com",
            projectId: "rexcloud-v1",
            storageBucket: "rexcloud-v1.firebasestorage.app",
            messagingSenderId: "755772237011",
            appId: "1:755772237011:web:77459b8b9c39beab73e026",
            measurementId: "G-PKW4884288"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginBtn = document.getElementById('googleLogin');
        const statusText = document.getElementById('status');

        // Login Button එක එබුවම වෙන දේ
        loginBtn.addEventListener('click', () => {
            statusText.innerText = "Connecting to Google...";
            signInWithRedirect(auth, provider);
        });

        // Redirect එකෙන් පස්සේ ආපහු ආවම result එක බලනවා
        getRedirectResult(auth)
            .then((result) => {
                if (result) {
                    const user = result.user;
                    statusText.innerText = "Welcome, " + user.displayName + "!";
                    statusText.style.color = "#4ade80"; // සාර්ථක නම් කොළ පාටින්
                    
                    // සාර්ථකව ලොග් වුණාම තත්පර 2කින් පස්සේ home page එකට යවන්න
                    setTimeout(() => {
                        window.location.href = "home.html"; 
                    }, 2000);
                }
            }).catch((error) => {
                if (error.code === 'auth/account-exists-with-different-credential') {
                    statusText.innerText = "Account already exists.";
                } else {
                    statusText.innerText = "Error: " + error.message;
                }
                console.error(error);
            });
    </script>
</body>
</html>
