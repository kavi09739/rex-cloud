<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REX CLOUD | Professional Encrypted Storage</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@200;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --accent: #ff416c; --bg-dark: #020205; --glass: rgba(255, 255, 255, 0.03); }
        body { background: radial-gradient(circle at top right, #12122b, var(--bg-dark)); color: #eee; font-family: 'Poppins', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
        .glass { background: var(--glass); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 28px; }
        .input-box { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 18px; padding: 15px; color: white; width: 100%; outline: none; transition: 0.3s; }
        .input-box:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.07); }
        .btn-main { background: linear-gradient(45deg, #ff416c, #ff4b2b); font-weight: bold; text-transform: uppercase; border-radius: 18px; transition: 0.4s; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255, 65, 108, 0.3); }
        
        /* Loading Bar Animation */
        .loading-shimmer { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        
        .cat-btn { padding: 8px 16px; border-radius: 12px; font-size: 10px; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .cat-btn.active { background: var(--accent); border-color: var(--accent); }

        #dust-overlay { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; }
    </style>
</head>
<body>
    <div id="dust-overlay"></div>

    <section id="authView" class="min-h-screen flex items-center justify-center p-6">
        <div class="glass p-10 w-full max-w-md text-center">
            <h1 class="orbitron text-4xl font-black mb-10 italic">REX CLOUD</h1>
            <div class="space-y-4">
                <input type="email" id="userEmail" placeholder="Terminal ID (Email)" class="input-box">
                <input type="password" id="userPass" placeholder="Access Code" class="input-box">
                <button onclick="handleAuth()" class="btn-main w-full py-4 mt-6">Initialize Session</button>
            </div>
        </div>
    </section>

    <section id="lockView" class="min-h-screen flex items-center justify-center p-6 hidden">
        <div class="glass p-10 w-full max-w-xs text-center">
            <i class="fas fa-fingerprint text-5xl text-red-500 mb-8 animate-pulse"></i>
            <h2 class="orbitron text-sm mb-10 tracking-[4px]">SECURITY CHECK</h2>
            <div class="grid grid-cols-3 gap-4" id="pinPad">
                </div>
            <button onclick="logout()" class="mt-10 text-[10px] uppercase opacity-40">Abort Session</button>
        </div>
    </section>

    <section id="mainView" class="min-h-screen p-4 hidden max-w-xl mx-auto pb-24">
        <header class="flex justify-between items-center py-6">
            <div>
                <h1 class="orbitron text-xl font-black italic">REX CLOUD</h1>
                <p class="text-[9px] text-gray-500 font-bold" id="sessionLabel"></p>
            </div>
            <button onclick="toggleView('settingsView')" class="glass h-12 w-12 flex items-center justify-center text-gray-400">
                <i class="fas fa-sliders-h"></i>
            </button>
        </header>

        <div class="glass p-6 mb-6">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <span class="text-3xl font-black orbitron" id="displayUsed">0.00</span>
                    <span class="text-[10px] text-gray-500 ml-1">GB USED</span>
                </div>
                <div class="text-right">
                    <p class="text-[9px] font-bold text-red-500">QUOTA: 1024 GB</p>
                    <p class="text-[11px] font-semibold" id="displayPercent">0.00%</p>
                </div>
            </div>
            <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                <div id="usageBar" class="h-full bg-gradient-to-r from-red-600 via-orange-500 to-emerald-400 transition-all duration-1000" style="width: 0%"></div>
            </div>
        </div>

        <div class="flex gap-2 overflow-x-auto pb-6 no-scrollbar">
            <button class="cat-btn active" onclick="filterFiles('all', this)">ALL</button>
            <button class="cat-btn" onclick="filterFiles('image', this)">IMAGES</button>
            <button class="cat-btn" onclick="filterFiles('video', this)">VIDEOS</button>
            <button class="cat-btn" onclick="filterFiles('doc', this)">DOCS</button>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <label class="glass p-6 flex flex-col items-center justify-center border-dashed border-2 border-white/5 cursor-pointer">
                <i class="fas fa-upload text-red-500 mb-2"></i>
                <span class="text-[10px] font-bold uppercase">Upload</span>
                <input type="file" class="hidden" onchange="uploadFile(this)">
            </label>
            <div onclick="remotePrompt()" class="glass p-6 flex flex-col items-center justify-center border-white/5 cursor-pointer">
                <i class="fas fa-link text-blue-500 mb-2"></i>
                <span class="text-[10px] font-bold uppercase">Remote</span>
            </div>
        </div>

        <div id="fileBox" class="space-y-4">
            </div>
    </section>

    <section id="settingsView" class="fixed inset-0 bg-black/95 z-[100] p-6 hidden">
        <div class="flex justify-between items-center mb-12">
            <h2 class="orbitron text-2xl font-black">SETTINGS</h2>
            <button onclick="toggleView('mainView')" class="text-3xl">&times;</button>
        </div>
        <div class="space-y-6 max-w-sm mx-auto">
            <div class="glass p-6">
                <label class="text-[10px] font-bold text-gray-500 uppercase mb-4 block">System Passcode</label>
                <input type="password" id="setPin" maxlength="4" placeholder="NEW 4-DIGIT PIN" class="input-box text-center orbitron tracking-[10px]">
                <button onclick="updatePin()" class="btn-main w-full py-3 mt-4 text-xs">Update Security</button>
            </div>
            <button onclick="logout()" class="w-full py-4 glass border-red-500/20 text-red-500 font-bold text-xs uppercase tracking-widest">Terminate Account</button>
        </div>
    </section>

    <script>
        // --- CONFIGURATION ---
        const REX_CONFIG = {
            BOT_TOKEN: '8664449438:AAFEvs3o65mnfIuaZSC06kfcZ_09VoAFg90',
            CHAT_ID: '8097272918',
            ADMIN_WA: '94767531213',
            TOTAL_GB: 1024
        };

        let db = JSON.parse(localStorage.getItem('REX_DB')) || [];
        let currentPin = localStorage.getItem('REX_PIN') || '1234';
        let pinEntry = "";

        // --- AUTH & NAVIGATION ---
        function handleAuth() {
            const email = document.getElementById('userEmail').value;
            if(!email) return alert("Identify yourself!");
            document.getElementById('sessionLabel').innerText = email;
            document.getElementById('authView').classList.add('hidden');
            document.getElementById('lockView').classList.remove('hidden');
            renderPinPad();
        }

        function renderPinPad() {
            const pad = document.getElementById('pinPad');
            pad.innerHTML = [...Array(9).keys()].map(i => `<button onclick="enterPin('${i+1}')" class="glass py-5 orbitron text-xl">${i+1}</button>`).join('') + 
                           `<button onclick="enterPin('0')" class="glass py-5 orbitron text-xl col-start-2">0</button>`;
        }

        function enterPin(n) {
            pinEntry += n;
            if(pinEntry.length === 4) {
                if(pinEntry === currentPin) {
                    document.getElementById('lockView').classList.add('hidden');
                    document.getElementById('mainView').classList.remove('hidden');
                    renderFiles();
                } else {
                    alert("ACCESS DENIED");
                    pinEntry = "";
                }
            }
        }

        // --- CORE FEATURES ---
        async function uploadFile(input) {
            const file = input.files[0];
            if(!file) return;

            const loader = createLoader(file.name);
            const formData = new FormData();
            formData.append('chat_id', REX_CONFIG.CHAT_ID);
            formData.append('document', file);

            try {
                const response = await fetch(`https://api.telegram.org/bot${REX_CONFIG.BOT_TOKEN}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });
                const res = await response.json();

                if(res.ok) {
                    const fileObj = {
                        id: 'rex_' + Date.now(),
                        name: file.name,
                        size: file.size,
                        type: getFileType(file.type),
                        date: new Date().toLocaleDateString(),
                        msgId: res.result.message_id
                    };
                    db.unshift(fileObj);
                    saveDB();
                    renderFiles();
                    alert("UPLOAD SUCCESS");
                } else throw new Error();
            } catch {
                alert("CRITICAL ERROR: Connection Terminated");
            } finally { loader.remove(); }
        }

        function getFileType(type) {
            if(type.includes('image')) return 'image';
            if(type.includes('video')) return 'video';
            return 'doc';
        }

        function renderFiles(filter = 'all') {
            const container = document.getElementById('fileBox');
            const filtered = filter === 'all' ? db : db.filter(f => f.type === filter);
            
            container.innerHTML = filtered.map(f => `
                <div class="glass p-5 flex justify-between items-center relative overflow-hidden" id="${f.id}">
                    <div class="flex items-center gap-4">
                        <div class="h-12 w-12 bg-white/5 rounded-2xl flex items-center justify-center text-red-500">
                            <i class="${getIcon(f.type)}"></i>
                        </div>
                        <div>
                            <p class="text-xs font-bold truncate max-w-[140px]">${f.name}</p>
                            <p class="text-[9px] text-gray-500 uppercase tracking-tighter">${(f.size/1024/1024).toFixed(2)} MB • ${f.date}</p>
                        </div>
                    </div>
                    <div class="flex gap-4">
                        <i class="fas fa-eye text-gray-500" onclick="viewFile('${f.msgId}')"></i>
                        <i class="fas fa-trash text-gray-700" onclick="dustEffect('${f.id}')"></i>
                    </div>
                </div>
            `).join('');
            updateBar();
        }

        function updateBar() {
            const usedBytes = db.reduce((a, b) => a + b.size, 0);
            const usedGB = usedBytes / (1024**3);
            const percent = (usedGB / REX_CONFIG.TOTAL_GB) * 100;

            document.getElementById('displayUsed').innerText = usedGB.toFixed(2);
            document.getElementById('displayPercent').innerText = percent.toFixed(2) + '%';
            document.getElementById('usageBar').style.width = percent + '%';

            if(percent > 90) {
                window.open(`https://wa.me/${REX_CONFIG.ADMIN_WA}?text=I%20WANT%20UPDATE%20TO%20PRO`, '_blank');
            }
        }

        // --- DUST ANIMATION ---
        async function dustEffect(id) {
            const el = document.getElementById(id);
            const canvas = await html2canvas(el, { backgroundColor: null });
            const ctx = canvas.getContext('2d');
            const { width, height } = canvas;
            const data = ctx.getImageData(0,0,width,height);
            
            el.style.opacity = '0';
            const rect = el.getBoundingClientRect();
            
            for(let i=0; i<15; i++) {
                const c = document.createElement('canvas');
                c.width = width; c.height = height;
                c.style.position = 'fixed'; c.style.left = rect.left+'px'; c.style.top = rect.top+'px';
                const lCtx = c.getContext('2d');
                const lData = lCtx.createImageData(width, height);
                for(let j=0; j<data.data.length; j+=4) {
                    if(Math.random() < i/15) {
                        lData.data[j]=data.data[j]; lData.data[j+1]=data.data[j+1];
                        lData.data[j+2]=data.data[j+2]; lData.data[j+3]=data.data[j+3];
                    }
                }
                lCtx.putImageData(lData, 0, 0);
                document.getElementById('dust-overlay').appendChild(c);
                c.animate([
                    { transform: 'translate(0,0)', opacity: 1 },
                    { transform: `translate(${Math.random()*100-50}px, -100px) rotate(${Math.random()*20}deg)`, opacity: 0 }
                ], { duration: 1000, easing: 'ease-in' }).onfinish = () => c.remove();
            }
            setTimeout(() => { db = db.filter(f => f.id !== id); saveDB(); renderFiles(); }, 800);
        }

        // --- HELPERS ---
        const getIcon = t => t==='image'?'fas fa-image':t==='video'?'fas fa-play-circle':'fas fa-file-alt';
        const saveDB = () => localStorage.setItem('REX_DB', JSON.stringify(db));
        const toggleView = id => {
            ['mainView', 'settingsView'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        };
        const updatePin = () => {
            const p = document.getElementById('setPin').value;
            if(p.length === 4) { localStorage.setItem('REX_PIN', p); currentPin = p; alert("PIN UPDATED"); }
        };
        const createLoader = name => {
            const div = document.createElement('div');
            div.className = "fixed inset-0 bg-black/80 backdrop-blur-md z-[200] flex items-center justify-center p-10 text-center";
            div.innerHTML = `<div class="orbitron"><i class="fas fa-sync fa-spin text-4xl text-red-500 mb-4"></i><br>SECURELY UPLOADING<br><span class="text-[10px] text-gray-500">${name}</span></div>`;
            document.body.appendChild(div);
            return div;
        };
        const viewFile = msg => window.open(`https://t.me/c/${REX_CONFIG.CHAT_ID}/${msg}`, '_blank');
        const logout = () => window.location.reload();
        const filterFiles = (type, btn) => {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderFiles(type);
        };
        const remotePrompt = () => {
            const url = prompt("Enter Remote URL:");
            if(url) alert("Remote injection sequence started. Data will be mirrored to cloud shortly.");
        };
    </script>
</body>
</html>
