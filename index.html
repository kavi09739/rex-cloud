<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REX CLOUD | Unlimited Edition</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --accent-primary: #ff416c;
            --bg-deep: #020205;
            --glass-white: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 65, 108, 0.05) 0%, transparent 40%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }

        .glass-card {
            background: var(--glass-white);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
        }

        #media-viewer {
            position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 10000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }

        .rex-input {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 15px; color: white; width: 100%;
            text-align: center; outline: none; transition: 0.3s;
        }
        .rex-input:focus { border-color: var(--accent-primary); background: rgba(255, 65, 108, 0.05); }

        .unlimited-badge {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .chip { padding: 10px 20px; border-radius: 15px; font-size: 9px; font-weight: 900; background: var(--glass-white); border: 1px solid var(--glass-border); text-transform: uppercase; }
        .chip-active { background: var(--accent-primary); border-color: var(--accent-primary); }

        .dust-out {
            animation: dustOut 0.8s ease-in forwards;
            pointer-events: none;
        }
        @keyframes dustOut {
            0% { transform: translateX(0) scale(1); opacity: 1; filter: blur(0); }
            100% { transform: translateX(100px) scale(0.8); opacity: 0; filter: blur(15px); }
        }

        .shake { animation: shake 0.4s both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            30%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        #uploading-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
            z-index: 20000; display: none; align-items: center; justify-content: center; flex-direction: column;
        }

        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.1); padding: 20px; border-radius: 50%;
            cursor: pointer; transition: 0.3s;
        }
        .nav-btn:hover { background: var(--accent-primary); }

        #custom-alert-modal, #welcome-screen {
            position: fixed; inset: 0; z-index: 99999;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
        }
        
        .welcome-anim {
            animation: welcomePop 2s ease-in-out forwards;
        }
        @keyframes welcomePop {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); filter: blur(10px); }
            30% { opacity: 1; transform: scale(1.05) translateY(0); filter: blur(0); }
            70% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
            100% { opacity: 0; transform: scale(1.1) translateY(-20px); filter: blur(15px); }
        }
    </style>
</head>
<body>

    <div id="uploading-overlay">
        <div class="text-center">
            <div class="inline-block animate-spin mb-6">
                <i class="fas fa-circle-notch text-5xl text-red-500"></i>
            </div>
            <h2 class="orbitron text-xl font-black tracking-[5px] text-white">UPLOADING...</h2>
            <p class="text-[9px] text-gray-500 mt-2 uppercase tracking-widest">Securing your object in Rex Vault</p>
        </div>
    </div>

    <div id="custom-alert-modal">
        <div class="glass-card p-8 w-[90%] max-w-sm text-center transform transition-all border border-red-500/30">
            <div class="h-16 w-16 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-5 border border-red-500/20">
                <i class="fas fa-shield-alt text-3xl text-red-500 animate-pulse"></i>
            </div>
            <h3 class="orbitron text-sm font-bold text-white mb-4 tracking-[3px] uppercase">Security Notice</h3>
            <p class="text-[11px] text-gray-300 mb-3 leading-relaxed font-semibold">ඔබ මෙම ඇප් එක සම්පූර්ණයෙන් close කලහොත් පමනක් ආරක්ශක සේවාව ක්‍රියාත්මක වෙන බව මතක තබා ගන්න.</p>
            <button onclick="closeCustomAlert()" class="w-full bg-red-600 hover:bg-red-700 py-4 rounded-xl font-bold uppercase text-[10px] tracking-[4px] transition">I Understand</button>
        </div>
    </div>

    <div id="welcome-screen">
        <div class="text-center" id="welcome-content">
            <i class="fas fa-cloud text-5xl text-red-500 mb-4 drop-shadow-[0_0_15px_rgba(255,65,108,0.8)]"></i>
            <h1 class="orbitron text-4xl font-black text-red-500 tracking-[5px] italic mt-2">Rex Cloud</h1>
        </div>
    </div>

    <div id="toast-error" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-red-600/90 text-white px-8 py-4 rounded-2xl hidden z-[9999] orbitron text-xs font-bold tracking-widest border border-red-400 text-center">WRONG CODE</div>

    <div id="remote-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[6000] hidden items-center justify-center p-6">
        <div class="glass-card p-8 w-full max-w-sm text-center">
            <h3 class="orbitron text-xs mb-6 text-blue-400">MIRROR INJECTION</h3>
            <input type="text" id="remote-url" placeholder="PASTE DIRECT LINK HERE" class="rex-input mb-4">
            <div class="flex gap-3">
                <button onclick="closeRemote()" class="flex-1 py-3 text-[10px] orbitron bg-white/5 rounded-xl">CANCEL</button>
                <button onclick="processRemote()" class="flex-1 py-3 text-[10px] orbitron bg-blue-600 rounded-xl">FETCH</button>
            </div>
        </div>
    </div>

    <div id="media-viewer">
        <button onclick="closeViewer()" class="absolute top-8 right-8 text-4xl text-white/50 z-50">&times;</button>
        
        <div onclick="navigateViewer(-1)" class="nav-btn left-4"><i class="fas fa-chevron-left text-xl"></i></div>
        <div onclick="navigateViewer(1)" class="nav-btn right-4"><i class="fas fa-chevron-right text-xl"></i></div>

        <div id="viewer-content" class="max-w-[95%] max-h-[85%] flex items-center justify-center"></div>
        <p id="viewer-name" class="mt-6 orbitron text-[10px] text-gray-500"></p>
    </div>

    <section id="screen-auth" class="min-h-screen flex items-center justify-center p-6 hidden">
        <div id="auth-card" class="glass-card p-10 w-full max-w-md text-center">
            <h1 class="orbitron text-4xl font-black mb-6 italic text-red-500">REX CLOUD</h1>
            <div class="flex gap-2 mb-8 bg-black/30 p-1 rounded-xl">
                <button id="btn-tab-reg" onclick="switchTab('reg')" class="flex-1 py-3 rounded-lg text-[10px] font-bold uppercase bg-red-600/20 text-red-500">Register</button>
                <button id="btn-tab-log" onclick="switchTab('log')" class="flex-1 py-3 rounded-lg text-[10px] font-bold uppercase text-gray-500">Login</button>
            </div>
            <div id="form-reg" class="space-y-4">
                <input type="email" id="reg-email" placeholder="YOUR EMAIL" class="rex-input">
                <input type="password" id="reg-pass" placeholder="SET PASSWORD" class="rex-input">
                <input type="password" id="reg-pin" placeholder="SET 4-DIGIT PIN" class="rex-input" maxlength="4">
                <button onclick="handleRegister()" class="w-full bg-red-600 py-4 rounded-xl font-bold uppercase text-[10px] tracking-widest mt-4">Create Vault</button>
            </div>
            <div id="form-log" class="space-y-4 hidden">
                <input type="email" id="log-email" placeholder="YOUR EMAIL" class="rex-input">
                <input type="password" id="log-pass" placeholder="YOUR PASSWORD" class="rex-input">
                <button onclick="handleLogin()" class="w-full bg-blue-600 py-4 rounded-xl font-bold uppercase text-[10px] tracking-widest mt-4">Access Vault</button>
            </div>
        </div>
    </section>

    <section id="screen-lock" class="min-h-screen flex flex-col items-center justify-center p-6 hidden">
        <div id="lock-card" class="glass-card p-10 w-full max-w-sm text-center">
            <div class="h-20 w-20 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-8 border border-red-500/20" onclick="triggerBiometric()">
                <i class="fas fa-fingerprint text-4xl text-red-500"></i>
            </div>
            <div id="pin-dots" class="flex justify-center gap-4 mb-10">
                <div class="h-3 w-3 rounded-full border border-red-500/50"></div>
                <div class="h-3 w-3 rounded-full border border-red-500/50"></div>
                <div class="h-3 w-3 rounded-full border border-red-500/50"></div>
                <div class="h-3 w-3 rounded-full border border-red-500/50"></div>
            </div>
            <div class="grid grid-cols-3 gap-4" id="pin-pad"></div>
        </div>
    </section>

    <section id="screen-dashboard" class="min-h-screen p-6 hidden max-w-2xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div><h1 class="orbitron text-xl font-bold">REX CLOUD</h1><p id="user-tag" class="text-[9px] text-gray-500 font-bold uppercase"></p></div>
            <button onclick="toggleSettings()" class="h-12 w-12 glass-card flex items-center justify-center text-gray-400"><i class="fas fa-cog"></i></button>
        </header>
        <div class="glass-card p-8 flex justify-between items-center mb-8 border-emerald-500/10">
            <div><p class="text-[8px] font-black text-gray-500 uppercase tracking-[3px]">Vault Status</p><h2 class="orbitron text-2xl font-black unlimited-badge">UNLIMITED</h2></div>
            <div class="text-right"><p id="stat-count" class="text-2xl font-black orbitron">0</p><p class="text-[8px] text-gray-500 font-bold uppercase">Objects Secured</p></div>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-8">
            <label class="glass-card p-6 flex flex-col items-center justify-center cursor-pointer border-dashed border-white/5"><i class="fas fa-cloud-upload-alt text-red-500 text-xl mb-3"></i><span class="text-[10px] font-black uppercase">Push Data</span><input type="file" multiple id="file-input" class="hidden" onchange="handleFiles(this)"></label>
            <div onclick="openRemote()" class="glass-card p-6 flex flex-col items-center justify-center cursor-pointer"><i class="fas fa-link text-blue-500 text-xl mb-3"></i><span class="text-[10px] font-black uppercase">Mirror Link</span></div>
        </div>
        <div class="flex gap-2 overflow-x-auto pb-6 no-scrollbar mb-4">
            <button onclick="renderFiles('all', this)" class="chip-active chip">All</button>
            <button onclick="renderFiles('image', this)" class="chip">Photos</button>
            <button onclick="renderFiles('video', this)" class="chip">Videos</button>
            <button onclick="renderFiles('doc', this)" class="chip">Docs</button>
        </div>
        <div id="file-container" class="space-y-4 pb-32"></div>
    </section>

    <div id="panel-settings" class="fixed inset-0 bg-black/98 z-[5000] p-10 hidden overflow-y-auto">
        <div class="max-w-md mx-auto pt-6 text-center">
            <div class="flex justify-between items-center mb-10">
                <h2 class="orbitron text-xl font-bold">SETTINGS</h2>
                <button onclick="toggleSettings()" class="text-4xl text-gray-600">&times;</button>
            </div>
            <button onclick="logout()" class="w-full py-5 text-red-500 font-black text-[10px] glass-card uppercase border-red-500/20">Log Out</button>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIG (මෙතනට ඔබේ Firebase Keys දමන්න) ---
        const firebaseConfig = {
            apiKey: "AIzaSyADiuQC24WIRTT__NI4mSgc7vjNpquy4CI",
            databaseURL: "https://rexcloud-v1-default-rtdb.firebaseio.com/",
            projectId: "rexcloud-v1",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const REX_ENV = {
            BOT_TOKEN: '8664449438:AAFEvs3o65mnfIuaZSC06kfcZ_09VoAFg90',
            CHAT_ID: '8097272918'
        };

        let DB = [];
        let SESSION = JSON.parse(localStorage.getItem('REX_SESSION')) || null;
        let currentPinInput = "";
        let currentViewingIndex = -1;
        let filteredList = [];

        window.onload = () => {
            if(!SESSION) {
                document.getElementById('screen-auth').classList.remove('hidden');
            } else {
                document.getElementById('screen-lock').classList.remove('hidden');
                document.getElementById('user-tag').innerText = SESSION.email;
                renderPinPad();
                syncDataFromFirebase();
            }
        };

        // --- Firebase Sync Functions ---
        async function syncDataFromFirebase() {
            if(!SESSION) return;
            const emailKey = SESSION.email.replace(/\./g, '_');
            database.ref('users/' + emailKey + '/files').on('value', (snapshot) => {
                DB = snapshot.val() || [];
                refreshDashboard();
            });
        }

        async function saveDBToFirebase() {
            if(!SESSION) return;
            const emailKey = SESSION.email.replace(/\./g, '_');
            await database.ref('users/' + emailKey + '/files').set(DB);
        }

        // --- Auth Functions ---
        async function handleRegister() {
            const email = document.getElementById('reg-email').value.toUpperCase();
            const pass = document.getElementById('reg-pass').value;
            const pin = document.getElementById('reg-pin').value;
            if(!email.includes('@') || !pass || pin.length !== 4) return showToast("INVALID INPUTS");
            
            const emailKey = email.replace(/\./g, '_');
            const snapshot = await database.ref('users/' + emailKey).once('value');
            if(snapshot.exists()) return showToast("ACCOUNT EXISTS");

            await database.ref('users/' + emailKey).set({ password: pass, pin: pin, files: [] });
            SESSION = { email: email, pin: pin };
            localStorage.setItem('REX_SESSION', JSON.stringify(SESSION));
            document.getElementById('custom-alert-modal').style.display = 'flex';
        }

        async function handleLogin() {
            const email = document.getElementById('log-email').value.toUpperCase();
            const pass = document.getElementById('log-pass').value;
            const emailKey = email.replace(/\./g, '_');
            
            const snapshot = await database.ref('users/' + emailKey).once('value');
            if(snapshot.exists() && snapshot.val().password === pass) {
                SESSION = { email: email, pin: snapshot.val().pin };
                localStorage.setItem('REX_SESSION', JSON.stringify(SESSION));
                location.reload();
            } else {
                showToast("WRONG PASSWORD");
            }
        }

        // --- File Handling & UI ---
        function showUploading(status) {
            document.getElementById('uploading-overlay').style.display = status ? 'flex' : 'none';
        }

        async function handleFiles(input) {
            const files = Array.from(input.files);
            if(files.length > 0) showUploading(true);

            for(const file of files) {
                const formData = new FormData();
                formData.append('chat_id', REX_ENV.CHAT_ID);
                formData.append('document', file);
                try {
                    const res = await fetch(`https://api.telegram.org/bot${REX_ENV.BOT_TOKEN}/sendDocument`, { method: 'POST', body: formData });
                    const data = await res.json();
                    if(data.ok) {
                        DB.unshift({
                            id: Date.now() + Math.random(),
                            name: file.name, size: file.size, type: file.type,
                            fileId: data.result.document.file_id,
                            cat: file.type.includes('image') ? 'image' : (file.type.includes('video') ? 'video' : 'doc')
                        });
                        await saveDBToFirebase();
                    }
                } catch(e) { alert("Upload Failed"); }
            }
            showUploading(false);
        }

        async function processRemote() {
            const url = document.getElementById('remote-url').value;
            if(!url) return;
            closeRemote();
            showUploading(true);
            try {
                const res = await fetch(`https://api.telegram.org/bot${REX_ENV.BOT_TOKEN}/sendDocument`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chat_id: REX_ENV.CHAT_ID, document: url })
                });
                const data = await res.json();
                if(data.ok) {
                    DB.unshift({
                        id: Date.now(), name: data.result.document.file_name || "Remote_File",
                        size: data.result.document.file_size || 0, type: data.result.document.mime_type || '',
                        fileId: data.result.document.file_id,
                        cat: (data.result.document.mime_type || '').includes('image') ? 'image' : 'doc'
                    });
                    await saveDBToFirebase();
                } else { showToast("USE DIRECT LINK"); }
            } catch(e) { showToast("Fetch Failed"); }
            showUploading(false);
        }

        // --- Gallery Viewer with Navigation ---
        function renderFiles(filter, btn) {
            if(btn) {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('chip-active'));
                btn.classList.add('chip-active');
            }
            const cont = document.getElementById('file-container');
            cont.innerHTML = "";
            filteredList = filter === 'all' ? DB : DB.filter(f => f.cat === filter);
            
            filteredList.forEach((f, index) => {
                const div = document.createElement('div');
                div.id = 'node-' + f.id;
                div.className = "glass-card p-5 flex justify-between items-center transition-all";
                div.innerHTML = `
                    <div class="flex items-center gap-4 flex-1 cursor-pointer" onclick="openViewer(${index})">
                        <i class="fas ${f.cat === 'image' ? 'fa-image text-red-500' : (f.cat === 'video' ? 'fa-play text-blue-500' : 'fa-file')}"></i>
                        <div class="overflow-hidden">
                            <p class="text-[11px] font-bold truncate max-w-[150px]">${f.name}</p>
                            <p class="text-[8px] text-gray-600 uppercase font-bold">${(f.size/1024/1024).toFixed(2)} MB</p>
                        </div>
                    </div>
                    <button onclick="executeDelete('${f.id}')" class="text-gray-700 hover:text-red-500 p-2"><i class="fas fa-trash-alt"></i></button>
                `;
                cont.appendChild(div);
            });
            document.getElementById('stat-count').innerText = DB.length;
        }

        async function openViewer(index) {
            currentViewingIndex = index;
            const file = filteredList[index];
            const viewer = document.getElementById('media-viewer');
            const content = document.getElementById('viewer-content');
            viewer.style.display = 'flex';
            content.innerHTML = `<i class="fas fa-circle-notch fa-spin text-2xl text-red-500"></i>`;
            
            const pathRes = await fetch(`https://api.telegram.org/bot${REX_ENV.BOT_TOKEN}/getFile?file_id=${file.fileId}`);
            const pathData = await pathRes.json();
            const url = `https://api.telegram.org/file/bot${REX_ENV.BOT_TOKEN}/${pathData.result.file_path}`;

            if(file.type.includes('image')) content.innerHTML = `<img src="${url}" class="max-w-full max-h-[70vh] rounded-2xl">`;
            else if(file.type.includes('video')) content.innerHTML = `<video src="${url}" controls autoplay class="max-w-full rounded-2xl"></video>`;
            else content.innerHTML = `<a href="${url}" target="_blank" class="bg-white text-black px-8 py-4 rounded-xl font-bold orbitron">OPEN FILE</a>`;
            document.getElementById('viewer-name').innerText = file.name.toUpperCase();
        }

        function navigateViewer(dir) {
            let next = currentViewingIndex + dir;
            if(next >= 0 && next < filteredList.length) openViewer(next);
        }

        // --- Helpers ---
        function closeViewer() { document.getElementById('media-viewer').style.display = 'none'; }
        function showToast(msg) {
            const t = document.getElementById('toast-error');
            t.innerText = msg; t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2000);
        }
        function closeCustomAlert() { location.reload(); }
        function toggleSettings() { document.getElementById('panel-settings').classList.toggle('hidden'); }
        function logout() { localStorage.removeItem('REX_SESSION'); location.reload(); }
        function refreshDashboard() { renderFiles('all'); }
        function openRemote() { document.getElementById('remote-modal').classList.remove('hidden'); document.getElementById('remote-modal').style.display = 'flex'; }
        function closeRemote() { document.getElementById('remote-modal').style.display = 'none'; }
        
        // PIN PAD & AUTH LOGIC (Existing from your code)
        function renderPinPad() {
            const pad = document.getElementById('pin-pad'); pad.innerHTML = "";
            for(let i=1; i<=9; i++) {
                const b = document.createElement('button'); b.className = "glass-card py-6 font-bold orbitron text-xl";
                b.innerText = i; b.onclick = () => handlePinInput(i); pad.appendChild(b);
            }
            const zero = document.createElement('button'); zero.className = "col-start-2 glass-card py-6 font-bold orbitron text-xl";
            zero.innerText = "0"; zero.onclick = () => handlePinInput(0); pad.appendChild(zero);
        }

        function handlePinInput(n) {
            if(currentPinInput.length < 4) {
                currentPinInput += n; updatePinVisuals();
                if(currentPinInput.length === 4) {
                    if(currentPinInput === SESSION.pin) {
                        document.getElementById('screen-lock').classList.add('hidden');
                        document.getElementById('welcome-screen').style.display = 'flex';
                        document.getElementById('welcome-content').classList.add('welcome-anim');
                        setTimeout(() => {
                            document.getElementById('welcome-screen').style.display = 'none';
                            document.getElementById('screen-dashboard').classList.remove('hidden');
                            refreshDashboard();
                        }, 1900);
                    } else {
                        showToast("WRONG CODE"); currentPinInput = ""; updatePinVisuals();
                    }
                }
            }
        }

        function updatePinVisuals() {
            const dots = document.querySelectorAll('#pin-dots div');
            dots.forEach((d, i) => {
                d.style.background = i < currentPinInput.length ? '#ff416c' : 'transparent';
            });
        }

        async function executeDelete(id) {
            DB = DB.filter(f => f.id != id);
            await saveDBToFirebase();
            refreshDashboard();
        }

        function switchTab(tab) {
            document.getElementById('form-reg').classList.toggle('hidden', tab !== 'reg');
            document.getElementById('form-log').classList.toggle('hidden', tab !== 'log');
        }
    </script>
</body>
